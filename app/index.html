<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosswind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a strip bay. Alerts sit in a rack like air-traffic flight strips;
     everything around them is quiet chart paper with one aeronautical-magenta accent. */
  --paper:#eef1ec; --surface:#fafbf8; --ink:#16222c; --ink-2:#4b5963; --ink-3:#77838b;
  --line:#d6dcd5; --line-2:#bcc5be; --accent:#a3246b; --accent-ink:#ffffff; --accent-wash:rgba(163,36,107,.10);
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --quiet:#c5cfd6;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95; --seq-7:#0d366b;
  --div-mid:#e6e8e3; --div-pos-1:#9ec5f4; --div-pos-2:#3987e5; --div-pos-3:#104281;
  --div-neg-1:#f2aaa9; --div-neg-2:#e34948; --div-neg-3:#9a2323;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  --r:6px; --nav:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1218; --surface:#141c24; --ink:#e7ecef; --ink-2:#b3bec6; --ink-3:#808c95;
    --line:#25303a; --line-2:#3a4752; --accent:#ee7db8; --accent-ink:#1c0a13; --accent-wash:rgba(238,125,184,.14);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --quiet:#3a4753;
    --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4; --seq-7:#cde2fb;
    --div-mid:#333d46; --div-pos-1:#256abf; --div-pos-2:#3987e5; --div-pos-3:#9ec5f4;
    --div-neg-1:#a23a3a; --div-neg-2:#e66767; --div-neg-3:#f4b0b0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1218; --surface:#141c24; --ink:#e7ecef; --ink-2:#b3bec6; --ink-3:#808c95;
  --line:#25303a; --line-2:#3a4752; --accent:#ee7db8; --accent-ink:#1c0a13; --accent-wash:rgba(238,125,184,.14);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --quiet:#3a4753;
  --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4; --seq-7:#cde2fb;
  --div-mid:#333d46; --div-pos-1:#256abf; --div-pos-2:#3987e5; --div-pos-3:#9ec5f4;
  --div-neg-1:#a23a3a; --div-neg-2:#e66767; --div-neg-3:#f4b0b0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-stretch:78%;letter-spacing:.005em}
h1{font-size:24px;font-weight:750;line-height:1.1}
h2{font-size:18px;font-weight:700;line-height:1.2}
h3{font-size:13px;font-weight:650;color:var(--ink-2)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.code{font-stretch:70%;font-weight:700;letter-spacing:.02em}
.boot{padding:24px 16px;color:var(--ink-2)}

/* ---- shell ---- */
#app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
#top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
#top .brand{display:flex;align-items:center;gap:8px;font-weight:750;font-stretch:80%;font-size:17px}
#top .brand svg{width:22px;height:22px;color:var(--accent)}
#main{overflow:auto;min-width:0;grid-row:2}
#nav{grid-row:3;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
#nav button{flex:1;min-width:0;border:0;background:none;padding:7px 2px 6px;display:grid;justify-items:center;gap:2px;
  font-size:11px;font-weight:600;color:var(--ink-3);font-stretch:85%}
#nav button svg{width:22px;height:22px}
#nav button[aria-current="page"]{color:var(--accent)}
#drawer{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;overscroll-behavior:contain}
.view{padding:16px 16px 28px;display:grid;gap:18px;max-width:1180px}
.view-head{display:grid;gap:4px}
.lede{color:var(--ink-2);max-width:66ch}
@media (min-width:900px){
  #app{grid-template-columns:var(--nav) minmax(0,1fr) auto;grid-template-rows:auto 1fr}
  #nav{grid-row:2;grid-column:1;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:10px 0;gap:4px}
  #nav button{flex:none;padding:9px 2px}
  #main{grid-row:2;grid-column:2}
  #drawer{position:static;grid-row:2;grid-column:3;width:min(480px,42vw);border-left:1px solid var(--line);background:var(--surface)}
  .view{padding:24px 28px 40px}
  .view>.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ---- controls ---- */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);color:var(--ink)}
.chip .n{color:var(--ink-3);font-weight:500;margin-left:4px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:650;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.field{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0;width:100%}
label.lab{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--ink-2)}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:650;text-align:left;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}

/* ---- status + severity ---- */
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:650;white-space:nowrap;color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill[data-s="open"]::before{background:var(--accent)}
.pill[data-s="acknowledged"]::before,.pill[data-s="investigating"]::before{background:var(--s1)}
.pill[data-s="resolved"]::before{background:var(--good)}
.pill[data-s="dismissed"]::before{background:none;border:1.5px solid var(--ink-3)}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.sev svg{width:14px;height:14px;flex:none}
.sev[data-v="critical"] svg{color:var(--critical)} .sev[data-v="high"] svg{color:var(--serious)} .sev[data-v="medium"] svg{color:var(--warning)}

/* ---- the strip bay ---- */
.bay{display:grid;gap:5px}
.strip{display:grid;grid-template-columns:8px minmax(0,1fr) auto;border:1px solid var(--line);background:var(--surface);border-radius:3px;
  text-align:left;padding:0;width:100%;color:inherit;overflow:hidden}
.strip:hover{border-color:var(--line-2)}
.strip[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.strip .holder{background:var(--warning)}
.strip[data-v="high"] .holder{background:var(--serious)} .strip[data-v="critical"] .holder{background:var(--critical)}
.strip .cells{display:grid;grid-template-columns:minmax(0,1fr);gap:1px 12px;padding:7px 10px}
.strip .route{font-size:21px;line-height:1.05;font-stretch:66%;font-weight:750;letter-spacing:.01em;white-space:nowrap}
.strip .route .arr{color:var(--ink-3);font-weight:500;padding:0 3px}
.strip .what{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.strip .stat{border-left:1px solid var(--line);padding:7px 10px;display:grid;align-content:center;justify-items:end;gap:1px;min-width:92px}
.strip .stat b{font-size:17px;font-stretch:75%;font-weight:750;line-height:1.1}
.strip .stat span{font-size:11px;color:var(--ink-3);text-align:right}
.strip.closed{opacity:.62}
@media (min-width:620px){
  .strip .cells{grid-template-columns:150px minmax(0,1fr);align-items:center}
}

/* ---- tables ---- */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px 6px 0;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:baseline}
th{font-size:12px;font-weight:650;color:var(--ink-2);position:sticky;top:0;background:var(--paper)}
#drawer th{background:var(--paper)}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums;padding-right:14px}
th button{border:0;background:none;padding:0;font:inherit;color:inherit}
th button[aria-sort]::after{content:" ↓";color:var(--accent)}
th button[aria-sort="ascending"]::after{content:" ↑"}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-wash)}
td.wrap{white-space:normal;min-width:160px}

/* ---- figures ---- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:10px 12px;display:grid;gap:1px}
.tile b{font-size:24px;font-weight:700;font-stretch:80%;line-height:1.15}
.tile span{font-size:12px;color:var(--ink-2)}
.tile small{font-size:11px;color:var(--ink-3)}
.fig{display:grid;gap:8px;min-width:0}
.fig-head{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.fig-head p{font-size:12px;color:var(--ink-3)}
.fig figcaption,.cap{font-size:12px;color:var(--ink-3);max-width:70ch}
figure{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.box{height:10px;width:10px;border-radius:2px}
.hbars{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;gap:5px 8px;align-items:center;font-size:13px}
.hbars .track{height:14px;position:relative}
.hbars .bar{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hbars .lbl{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.hbars .val{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.grid2{display:grid;gap:22px 28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
svg text{font-family:var(--font);fill:var(--ink-3);font-size:11px}
svg .axis{stroke:var(--line-2)} svg .gridl{stroke:var(--line)}
.sect{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}

/* ---- drawer ---- */
.d-head{position:sticky;top:0;z-index:2;background:inherit;display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.d-head .kind{font-size:12px;font-weight:650;color:var(--ink-3);margin-right:auto}
.d-body{padding:14px 16px 32px;display:grid;gap:16px}
.icon-btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);width:34px;height:34px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.why{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;font-size:13px}
#drawer .why{background:var(--paper)}
.eq{font-size:14px;font-variant-numeric:tabular-nums;overflow-x:auto;white-space:nowrap;padding:2px 0}
.eq i{font-style:italic;font-family:Georgia,"Times New Roman",serif}
.log{display:grid;gap:6px;font-size:12px;color:var(--ink-2);list-style:none;margin:0;padding:0}
.note{font-size:12px;color:var(--ink-3)}
.banner{border:1px solid var(--line-2);border-left:4px solid var(--warning);border-radius:3px;padding:8px 10px;font-size:13px;background:var(--surface)}

/* ---- map, lineage ---- */
.mapwrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;position:relative;touch-action:pan-y}
.mapwrap svg{display:block;width:100%;height:auto}
.lin-wrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.lin-wrap svg{display:block}
.node rect{fill:var(--surface);stroke:var(--line-2)}
.node text{fill:var(--ink);font-size:11.5px;font-weight:600}
.node{cursor:pointer}
.node.sel rect{stroke:var(--accent);stroke-width:2}
.node.dim{opacity:.28}
.edge{fill:none;stroke:var(--line-2);stroke-width:1}
.edge.on{stroke:var(--accent);stroke-width:1.6}
.edge.dim{opacity:.18}

/* ---- tooltip ---- */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:4px;padding:6px 9px;font-size:12px;max-width:260px;line-height:1.35}
#tip b{font-size:13px}

/* ---- ask ---- */
.chat{display:grid;gap:12px;max-width:760px}
.msg{display:grid;gap:6px}
.msg.q{justify-self:end;background:var(--accent-wash);border-radius:10px 10px 2px 10px;padding:8px 12px;max-width:88%}
.msg.a{border-left:3px solid var(--line-2);padding-left:12px}
.msg.a p{margin:0 0 6px} .msg.a ul{margin:0 0 6px;padding-left:18px}
.steps{font-size:12px;color:var(--ink-3);display:grid;gap:2px}
details.q summary{cursor:pointer;font-size:12px;color:var(--ink-2)}
details.q pre{font-size:11px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px;margin:6px 0 0;max-height:220px}
@media (prefers-reduced-motion:no-preference){
  #drawer:not([hidden]){animation:slide .16s ease-out}
  @keyframes slide{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
}

/* ---- touch ---- */
@media (pointer:coarse){
  .chip{padding:8px 13px}
  .seg button{padding:9px 12px}
  .btn{padding:10px 14px}
  .icon-btn{width:42px;height:42px}
  th button{padding:5px 0}
  .linkish{padding:3px 0}
  tbody tr.click td{padding-top:9px;padding-bottom:9px}
}
@media (max-width:619px){
  .view{gap:14px;padding-top:14px}
  .view-head .lede{font-size:14px}
  h1{font-size:22px}
}

/* ---- live mode ---- */
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:grid;gap:8px;align-content:start}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-head .code{font-size:22px;line-height:1}
.card p{font-size:13px}
.lstat{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;white-space:nowrap}
.lstat svg{width:14px;height:14px;flex:none}
.lstat[data-r="0"] svg{color:var(--good)} .lstat[data-r="1"] svg{color:var(--warning)} .lstat[data-r="2"] svg{color:var(--serious)} .lstat[data-r="3"] svg{color:var(--critical)}

</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <nav id="nav" aria-label="Views"></nav>
  <main id="main" tabindex="-1"><p class="boot">Loading flight data…</p></main>
  <aside id="drawer" aria-label="Details" hidden></aside>
</div>
<div id="tip" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
// ---------- DOM helpers ----------
const $ = (sel, root = document) => root.querySelector(sel);
const SVG_NS = 'http://www.w3.org/2000/svg';
function build(el, attrs, kids) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'text') el.textContent = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const h = (tag, attrs, ...kids) => build(document.createElement(tag), attrs, kids);
const s = (tag, attrs, ...kids) => build(document.createElementNS(SVG_NS, tag), attrs, kids);
const put = (el, ...kids) => build(el, null, kids);   // append, skipping null / false

// ---------- formatting ----------
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY0 = Date.UTC(2013, 0, 1);
const dayIdx = iso => Math.round((Date.parse(iso + 'T00:00:00Z') - DAY0) / 864e5);
const idxDate = i => new Date(DAY0 + i * 864e5).toISOString().slice(0, 10);
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const F = {
  int: n => n == null ? '–' : Math.round(n).toLocaleString('en-US'),
  pct: (v, d = 0) => v == null ? '–' : (v * 100).toFixed(d) + '%',
  num: (v, d = 1) => v == null ? '–' : Number(v).toFixed(d),
  min: v => v == null ? '–' : `${Math.round(v)} min`,
  smin: v => { if (v == null) return '–'; const r = Math.round(v); return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r) + ' min'; },
  date: iso => { const d = new Date(iso + 'T00:00:00Z'); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; },
  hhmm: v => v == null ? '–' : String(Math.floor(v / 100)).padStart(2, '0') + ':' + String(v % 100).padStart(2, '0'),
  p: v => { if (v == null) return '–'; if (v >= 0.001) return v.toFixed(3);
    const [m, e] = v.toExponential(1).split('e'); return `${m} × 10${[...String(+e)].map(c => SUP[c]).join('')}`; },
};

// ---------- colour ----------
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
function ramp(stops) {
  const cols = stops.map(rgb);
  return t => {
    const x = Math.max(0, Math.min(1, t)) * (cols.length - 1), i = Math.min(cols.length - 2, Math.floor(x)), f = x - i;
    return `rgb(${cols[i].map((c, k) => Math.round(c + (cols[i + 1][k] - c) * f)).join(',')})`;
  };
}
let PAL = {};
function readPalette() {
  const seq = ramp([1, 2, 3, 4, 5, 6, 7].map(i => cssVar('--seq-' + i)));
  const pos = ramp([cssVar('--div-mid'), cssVar('--div-pos-1'), cssVar('--div-pos-2'), cssVar('--div-pos-3')]);
  const neg = ramp([cssVar('--div-mid'), cssVar('--div-neg-1'), cssVar('--div-neg-2'), cssVar('--div-neg-3')]);

  apply(id, patch, entry) {
    if (this.mode === 'readonly') return;
    const cur = this.get(id), now = new Date().toISOString();
    const next = { status: cur.status, assignee: cur.assignee || '', ...patch, updated: now,
      history: [...(cur.history || []), ...(entry ? [{ at: now, by: this.me || 'local', ...entry }] : [])].slice(-40) };
    this.map.set(id, next); this.emit();
    if (this.mode === 'shared') {
      this.queue[id] = (this.queue[id] || Promise.resolve()).then(() => this.db.doc('triage/' + id).set(next)).catch(err => {
        if (err && err.code === 'invalid_argument') this.mode = 'readonly';
        this.error = 'That change was not saved. ' + (this.mode === 'readonly' ? 'You have view-only access.' : 'Try again in a moment.');
        this.emit();
      });
    } else {
      try { localStorage.setItem('crosswind.triage', JSON.stringify(Object.fromEntries(this.map))); } catch (e) { /* storage unavailable */ }
    }
  },
  who(id) { return id === 'local' || (this.me && id === this.me) ? 'you' : (this.names[id] || 'a collaborator'); },
  describe() {
    return { shared: 'Triage is saved with this page and shared with everyone who can open it.',
      readonly: 'You can read triage here. Changing it needs contributor access.',
      local: 'Triage is saved in this browser only.' }[this.mode] + (this.stale ? ' Saved triage has not loaded yet, so this may be out of date.' : '');
  },
  init() {
    try { for (const [k, v] of Object.entries(JSON.parse(localStorage.getItem('crosswind.triage') || '{}'))) this.map.set(k, v); } catch (e) { /* none */ }
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(async ([db, user]) => {
      if (!db) return;
      this.db = db; this.user = user;
      let canWrite = null;
      try { this.me = user ? await user.id() : null; canWrite = user ? await user.can('data.write') : null; } catch (e) { /* not told */ }
      this.mode = canWrite === false ? 'readonly' : 'shared';
      const timer = setTimeout(() => { this.stale = true; this.emit(); }, 10000);
      db.collection('triage').onSnapshot(snap => {
        if (!snap.metadata.fromCache) { clearTimeout(timer); this.stale = false; }
        this.map = new Map(snap.docs.map(d => [d.id, d.data()]));
        const ids = [...new Set(snap.docs.flatMap(d => (d.data().history || []).map(e => e.by)))].filter(i => i && i !== 'local' && !this.names[i]);
        if (ids.length && user && user.profiles) {
          Promise.resolve(user.profiles(ids)).then(ps => { for (const i of ids) this.names[i] = (ps && ps[i] && ps[i].name) || 'a collaborator'; this.emit(); }).catch(() => {});
        }
        this.emit();
      }, () => { clearTimeout(timer); this.mode = 'local'; this.emit(); });
    }).catch(() => {});
  },
};

function alertChart(a) {
  const daily = D.byId.daily?.get(a.route);

  const i0 = dayIdx(a.date), hi = PAL.series[0];

    for (let k = 0; 7 * k - 1 < 365; k++) {
      let arr = 0, late = 0;
      for (let i = Math.max(0, 7 * k - 1); i <= Math.min(364, 7 * k + 5); i++) { arr += daily.arr[i]; late += daily.late[i]; }
      const start = idxDate(Math.max(0, 7 * k - 1)), on = 7 * k - 1 === i0;
      weeks.push({ label: +start.slice(8) <= 7 ? MONTHS[+start.slice(5, 7) - 1] : null, value: arr ? late / arr : null, color: on ? hi : PAL.quiet,
        mark: on ? F.pct(late / arr) : null, date: start, arr, late,
        tip: [`Week of ${F.date(start)}`, [['of arrivals late', arr ? F.pct(late / arr) : '–'], ['arrivals', F.int(arr)]]] });
    }

      chart: w => colChart({ width: w, items: weeks, yFmt: v => F.pct(v), ref: { value: 0.5, label: '50%' }, yMax: 1 }),
      table: { cols: [{ key: 'date', label: 'Week starting', fmt: F.date }, { key: 'late', label: 'Late', num: true }, { key: 'arr', label: 'Arrivals', num: true },
        { key: 'value', label: 'Share', num: true, fmt: v => F.pct(v) }], rows: weeks } });
  }

  for (let i = Math.max(0, i0 - 28); i <= Math.min(364, i0 + 7); i++) {
    const date = idxDate(i), value = spike ? daily.dep[i] : (daily.n[i] ? daily.c[i] : null);
    items.push({ label: (i - i0) % 7 === 0 ? `${+date.slice(8)} ${MONTHS[+date.slice(5, 7) - 1]}` : null, value, date, n: daily.n[i], c: daily.c[i],

    sub: 'Four weeks before the alert and one week after. The alert day is highlighted.',
    chart: w => colChart({ width: w, items, yFmt: spike ? v => `${v}` : F.int }),
    table: { cols: [{ key: 'date', label: 'Day', fmt: F.date }, { key: 'n', label: 'Scheduled', num: true },

}

    d.flights += r.flights; d.arrived += r.arrived; d.late += r.arrived * (1 - r.on_time); d.cancelled += r.cancelled; d.alerts += r.alerts; d.routes.push(r);
  }
  for (const d of m.values()) { d.on_time = d.arrived ? 1 - d.late / d.arrived : null; d.cancel_rate = d.cancelled / d.flights; d.live = Live.rank(d.id); }
  return m;
}

function drawMap(width) {
  const key = mapKey(), geo = D.geo, metric = METRICS[key], routes = mapRoutes(), dests = destStats(routes);
  if (key === 'live') for (const r of routes) r.live = Live.rank(r.d);
  const inView = [...dests.keys()].map(id => D.byId.airport.get(id)).filter(a => MP.zoom === 'all' || a.miles <= 2800);
  const xs = inView.map(a => a.x).concat(0), ys = inView.map(a => a.y).concat(0);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padX = (x1 - x0) * 0.06, padY = (y1 - y0) * 0.08; x0 -= padX; x1 += padX * 1.6; y0 -= padY; y1 += padY;
  const height = Math.round(Math.max(width * 0.55, Math.min(width * 1.05, width * (y1 - y0) / (x1 - x0))));
  const k = Math.min(width / (x1 - x0), height / (y1 - y0)), ox = (width - (x1 - x0) * k) / 2, oy = (height - (y1 - y0) * k) / 2;
  const X = x => ox + (x - x0) * k, Y = y => oy + (y - y0) * k;
  const ringPath = flat => { let d = ''; for (let i = 0; i < flat.length; i += 2) d += (i ? 'L' : 'M') + X(flat[i]).toFixed(1) + ' ' + Y(flat[i + 1]).toFixed(1); return d + 'Z'; };
  const svg = s('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img',
    'aria-label': `Routes from New York coloured by ${metric.label.toLowerCase()}` });
  svg.append(s('path', { d: geo.land.map(ringPath).join(''), fill: 'var(--paper)', stroke: 'var(--line-2)', 'stroke-width': 0.6 }),
    s('path', { d: geo.states.flatMap(st => st.rings.map(ringPath)).join(''), fill: 'var(--paper)', stroke: 'var(--line-2)', 'stroke-width': 0.6, 'stroke-linejoin': 'round' }));
  for (const miles of (MP.zoom === 'all' ? [1000, 2000, 3000, 4000, 5000] : [500, 1000, 1500, 2000, 2500])) {
    svg.append(s('circle', { cx: X(0), cy: Y(0), r: miles * k, fill: 'none', stroke: 'var(--line-2)', 'stroke-width': 0.7, opacity: 0.8 }),
      s('text', { x: X(miles * 0.259), y: Y(miles * 0.966) + 3, 'text-anchor': 'middle', style: 'font-size:10px;paint-order:stroke;stroke:var(--surface);stroke-width:3px' }, `${F.int(miles)} mi`));
  }
  const maxF = Math.max(...routes.map(r => r.flights)), lines = s('g');
  const ordered = [...routes].sort((a, b) => metric.worstFirst(b[key], a[key]));
  for (const r of ordered) {
    const o = D.byId.airport.get(r.o), d = D.byId.airport.get(r.d), dim = MP.sel && r.d !== MP.sel;
    lines.append(s('line', { x1: X(o.x), y1: Y(o.y), x2: X(d.x), y2: Y(d.y), stroke: metric.color(r[key]),
      'stroke-width': (0.7 + 2.6 * Math.sqrt(r.flights / maxF)).toFixed(2), 'stroke-linecap': 'round', opacity: dim ? 0.1 : 0.8 }));
  }
  svg.append(lines);
  const maxD = Math.max(...[...dests.values()].map(d => d.flights)), placed = [];
  const byFlights = [...dests.values()].sort((a, b) => b.flights - a.flights);
  const labelCount = width < 520 ? 12 : 30, labels = s('g'), points = [];
  placed.push([X(0) + 6, Y(0) + 3, X(0) + 66, Y(0) + 19]);   // keep airport codes clear of the New York label
  byFlights.forEach((d, rank) => {
    const a = D.byId.airport.get(d.id), cx = X(a.x), cy = Y(a.y);
    if (cx < -20 || cx > width + 20 || cy < -20 || cy > height + 20) return;
    const r = 2.5 + 5.5 * Math.sqrt(d.flights / maxD), g = s('g', { opacity: MP.sel && MP.sel !== d.id ? 0.35 : 1 });
    g.append(s('circle', { cx, cy, r, fill: metric.color(d[key]), stroke: MP.sel === d.id ? 'var(--accent)' : PAL.surface, 'stroke-width': MP.sel === d.id ? 2.5 : 1.5 }));
    const box = [cx + r + 2, cy - 7, cx + r + 2 + 24, cy + 6];
    if ((rank < labelCount || MP.sel === d.id) && !placed.some(p => box[0] < p[2] && box[2] > p[0] && box[1] < p[3] && box[3] > p[1])) {
      placed.push(box);
      labels.append(s('text', { x: cx + r + 3, y: cy + 4, opacity: MP.sel && MP.sel !== d.id ? 0.4 : 1, style: 'fill:var(--ink);font-weight:700;font-stretch:75%;paint-order:stroke;stroke:var(--surface);stroke-width:2.5px;pointer-events:none' }, d.id));
    }
    // Keyboard target only; pointer input goes through the nearest-airport layer below.
    const hit = s('circle', { cx, cy, r: r + 3, fill: 'transparent', tabindex: 0, role: 'button', style: 'pointer-events:none',
      'aria-label': `${a.name}, ${metric.label} ${metric.fmt(d[key])}` });
    const tip = () => tipRows(`${d.id}  ${a.name}`, [[metric.label.toLowerCase(), metric.fmt(d[key])], ['flights', F.int(d.flights)], ['miles', F.int(a.miles)]]);
    const pick = () => { MP.sel = MP.sel === d.id ? null : d.id; VIEW.map.redraw(); };
    hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    hit.addEventListener('focus', () => Tip.show({ clientX: svg.getBoundingClientRect().left + cx, clientY: svg.getBoundingClientRect().top + cy }, tip()));
    hit.addEventListener('blur', Tip.hide);
    points.push({ cx, cy, tip, pick });
    g.append(hit); svg.append(g);
  });
  // Dense clusters: the pointer only has to be closest to an airport, within 26px.
  const layer = s('rect', { x: 0, y: 0, width, height, fill: 'transparent' });
  const nearest = e => {
    const box = svg.getBoundingClientRect(), px = (e.clientX - box.left) * (width / box.width), py = (e.clientY - box.top) * (width / box.width);
    let best = null, bd = 26 * 26;
    for (const pt of points) { const dd = (pt.cx - px) ** 2 + (pt.cy - py) ** 2; if (dd < bd) { bd = dd; best = pt; } }
    return best;
  };
  layer.addEventListener('pointermove', e => { const pt = nearest(e); layer.style.cursor = pt ? 'pointer' : 'default'; pt ? Tip.show(e, pt.tip()) : Tip.hide(); });
  layer.addEventListener('pointerleave', Tip.hide);
  layer.addEventListener('click', e => { const pt = nearest(e); if (pt) { Tip.hide(); pt.pick(); } });
  svg.append(layer);
  svg.append(labels, s('circle', { cx: X(0), cy: Y(0), r: 4.5, fill: 'var(--ink)', stroke: PAL.surface, 'stroke-width': 1.5 }),
    s('text', { x: X(0) + 9, y: Y(0) + 15, style: 'fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:2.5px' }, 'New York'));
  return svg;
}

// ---------- pipeline: lineage drawn from the DAG the pipeline actually ran ----------
const PL = { sel: null };
const LAYERS = [['raw', 'Raw'], ['clean', 'Clean'], ['processed', 'Processed'], ['enriched', 'Enriched'], ['transform', 'Transform'],
  ['metrics', 'Metrics'], ['alerts', 'Alerts'], ['ontology', 'Ontology tables'], ['object', 'Object types']];
const GROUPS = ['Operations source', 'Weather source', 'Reference data', 'Flight delays', 'Aviation metrics', 'Alerting', 'Aviation ontology', 'Object types'];
const CHECK_NOTES = {
  'tail_number resolves in processed/aircraft': 'Some carriers report fleet numbers instead of registered tail numbers. Their flights count everywhere but carry no Aircraft link.',
  'reported distance within 2% of great-circle': 'EWR to LGA is a 17-mile hop, where rounding to whole miles exceeds 2%.',
};
function lineageNodes() {
  if (D.nodes) return D.nodes;
  const nodes = D.core.lineage.map(d => ({ ...d, short: d.name.split('/')[1] }));
  for (const ot of D.core.ontology.objectTypes) {
    nodes.push({ name: 'object/' + ot.id, short: ot.name, layer: 'object', group: 'Object types', inputs: [ot.backing], rows: ot.objects,
      description: ot.description, objectType: ot, checks: [], health: 'pass', columns: [] });
  }
  const by = new Map(nodes.map(n => [n.name, n]));
  for (const n of nodes) n.outputs = [];
  for (const n of nodes) for (const i of n.inputs) by.get(i).outputs.push(n.name);
  D.nodes = nodes; D.byId.node = by;
  return nodes;
}
function closure(start, dir) {
  const seen = new Set(), todo = [start];
  while (todo.length) for (const nxt of D.byId.node.get(todo.pop())[dir]) if (!seen.has(nxt)) { seen.add(nxt); todo.push(nxt); }
  return seen;
}

function drawLineage() {
  const nodes = lineageNodes(), NW = 150, NH = 24, GX = 44, GY = 7, TOP = 30;
  const cols = LAYERS.map(([id]) => nodes.filter(n => n.layer === id));
  const tall = Math.max(...cols.map(c => c.length)) * (NH + GY);
  const place = () => cols.forEach((col, ci) => col.forEach((n, i) => {
    n.x = 8 + ci * (NW + GX); n.y = TOP + (tall - col.length * (NH + GY)) / 2 + i * (NH + GY);
  }));
  const mean = names => names.reduce((a, name) => a + D.byId.node.get(name).y, 0) / (names.length || 1);
  place();
  for (let sweep = 0; sweep < 4; sweep++) {
    const fwd = sweep % 2 === 0;
    for (const col of fwd ? cols.slice(1) : cols.slice(0, -1).reverse()) {
      col.sort((a, b) => { const ka = fwd ? a.inputs : a.outputs, kb = fwd ? b.inputs : b.outputs; return (ka.length ? mean(ka) : a.y) - (kb.length ? mean(kb) : b.y); });
      place();
    }
  }
  const W = 16 + cols.length * (NW + GX) - GX, H = TOP + tall + 8;
  const up = PL.sel ? closure(PL.sel, 'inputs') : new Set(), down = PL.sel ? closure(PL.sel, 'outputs') : new Set();
  const lit = name => name === PL.sel || up.has(name) || down.has(name);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img',
    'aria-label': 'Data lineage from raw source files, through cleaning, enrichment and metrics, to ontology tables and object types' });
  LAYERS.forEach(([, label], ci) => svg.append(s('text', { x: 8 + ci * (NW + GX), y: 16, style: 'font-weight:650;fill:var(--ink-2);font-size:12px' }, label)));
  const edges = s('g');
  for (const n of nodes) for (const i of n.inputs) {
    const a = D.byId.node.get(i), x1 = a.x + NW, y1 = a.y + NH / 2, x2 = n.x, y2 = n.y + NH / 2, dx = Math.max(18, (x2 - x1) / 2);
    const on = PL.sel && lit(i) && lit(n.name) && (n.name === PL.sel || i === PL.sel || (up.has(n.name) && up.has(i)) || (down.has(n.name) && down.has(i)));
    edges.append(s('path', { class: 'edge' + (on ? ' on' : PL.sel ? ' dim' : ''), d: `M${x1} ${y1}C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}` }));
  }
  svg.append(edges);
  for (const n of nodes) {
    const g = s('g', { class: 'node' + (n.name === PL.sel ? ' sel' : PL.sel && !lit(n.name) ? ' dim' : ''), tabindex: 0, role: 'button',
      'aria-label': `${n.name}, ${F.int(n.rows)} rows` });
    const label = n.short.length > 21 ? n.short.slice(0, 20) + '…' : n.short;
    g.append(s('rect', { x: n.x, y: n.y, width: NW, height: NH, rx: 3 }),
      s('rect', { x: n.x, y: n.y, width: 5, height: NH, rx: 2, style: `fill:${PAL.series[GROUPS.indexOf(n.group)]};stroke:none` }),
      s('text', { x: n.x + 11, y: n.y + 16 }, label));
    if (n.health !== 'pass') g.append(s('path', { d: `M${n.x + NW - 13} ${n.y + 6}l6 11h-12z`, fill: n.health === 'fail' ? 'var(--critical)' : 'var(--warning)' }));
    const pick = () => { PL.sel = n.name; VIEW.pipeline.redraw(); openObj('dataset', n.name, true); };
    g.addEventListener('click', pick); g.addEventListener('keydown', e => { if (e.key === 'Enter') pick(); });
    tipOn(g, () => tipRows(n.name, [['rows', F.int(n.rows)], ...(n.health !== 'pass' ? [['', 'has a warning']] : [])]));
    svg.append(g);
  }
  return svg;
}

function drawOntology() {

      s('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))));
  const pairs = new Map();
  for (const l of ont.linkTypes) { const key = l.from + '>' + l.to; pairs.set(key, [...(pairs.get(key) || []), l.name]); }
  const edge = (a, b) => {   // clip the centre line to both boxes
    const [ax, ay] = [P[a][0] + NW / 2, P[a][1] + NH / 2], [bx, by] = [P[b][0] + NW / 2, P[b][1] + NH / 2], dx = bx - ax, dy = by - ay;

    svg.append(s('line', { x1, y1, x2, y2, stroke: 'currentColor', 'stroke-width': 1, 'marker-end': 'url(#arr)', style: 'color:var(--ink-3)' }),
      s('text', { x: mx, y: my + 3, 'text-anchor': 'middle', style: 'font-size:10.5px;fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:4px' }, names.join(', ')));

    g.append(s('rect', { x, y, width: NW, height: NH, rx: 3 }), s('text', { x: x + 10, y: y + 15 }, ot.name),

    const pick = () => openObj('dataset', 'object/' + id, true);
    g.addEventListener('click', pick); g.addEventListener('keydown', e => { if (e.key === 'Enter') pick(); });
    svg.append(g);
  }

}

const clock = iso => new Date(iso).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });

const Live = {
  data: null, history: [], state: 'loading',
  async load() {
    try {
      const res = await fetch('data/live.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      this.data = await res.json(); this.state = 'ok';
      const hist = await fetch('data/live_history.json', { cache: 'no-store' }).catch(() => null);
      if (hist && hist.ok) this.history = await hist.json();
    } catch (err) { if (!this.data) this.state = 'unavailable'; }
    return this.state === 'ok';
  },
  rank(code) { return this.data?.status?.[code] ?? 0; },
  age() {
    const m = Math.max(0, Math.round((Date.now() - Date.parse(this.data.generated)) / 60000));
    return m < 1 ? 'updated just now' : m < 90 ? `updated ${m} min ago` : m < 2880 ? `updated ${Math.round(m / 60)} h ago` : `last updated ${clock(this.data.generated)}`;
  },
};
function liveUnavailable() {
  const onSite = location.hostname.endsWith('github.io');
  return [viewHead('Live', 'Live mode shows current FAA airport status and weather for New York departures, beside what was normal in 2013.'),
    h('div', { class: 'banner' }, onSite ? 'The live data file has not been published yet. The scheduled job writes it every 15 minutes; check back shortly.'
      : ['This copy of the page cannot reach outside data, so live mode runs on the public site, which refreshes every 15 minutes: ', h('a', { href: LIVE_SITE, text: LIVE_SITE })]),
    h('p', { class: 'note', text: 'The 2013 archive works here in full. Switch with the control at the top.' })];
}
function liveStrip(a) {
  const stat = a.kind === 'ground_stop' || a.kind === 'closure' ? [a.until ? `until ${a.until}` : 'in effect', a.label.toLowerCase()]
    : a.avg != null ? [`avg ${fmtMin(a.avg)}`, 'assigned delay'] : [spanText(a) || 'in effect', a.label.toLowerCase()];
  const from = a.routes.length === 1 ? a.routes[0].split('-')[0] : 'NYC';
  return h('button', { class: 'strip', type: 'button', 'data-v': a.sev, 'data-id': a.id, onclick: () => openObj('live', a.id, true) },
    h('span', { class: 'holder' }),
    h('span', { class: 'cells' },
      h('span', { class: 'route' }, a.scope === 'origin' ? a.airport : [from, h('span', { class: 'arr', text: '→' }), a.airport]),
      h('span', { class: 'what' }, sevMark(a.sev), h('span', { text: a.label }), a.reason && h('span', { class: 'muted', text: a.reason }))),
    h('span', { class: 'stat' }, h('b', { style: { fontSize: stat[0].length > 9 ? '14px' : null }, text: stat[0] }), h('span', { text: stat[1] })));
}
function airportCard(code, a) {
  const w = a.weather, b = a.baseline;
  const program = p => `${p.label}${p.avg != null ? `, averaging ${fmtMin(p.avg)}` : p.span ? `, ${p.span}` : ''}${p.trend ? `, ${p.trend.toLowerCase()}` : ''}${p.until ? `, until ${p.until}` : ''}${p.reason ? ` (${p.reason})` : ''}.`;
  return h('div', { class: 'card' },
    h('div', { class: 'card-head' }, link('airport', code, h('span', { class: 'code', text: code })), liveMark(a.status)),
    h('p', { class: 'muted', text: a.name }),
    a.programs.length ? a.programs.map(p => h('p', { text: program(p) })) : h('p', { text: 'No FAA programme in effect.' }),
    h('p', { text: w ? `${w.category || 'Weather'}: visibility ${w.visibility_mi ?? '–'} mi, ${w.ceiling_ft != null ? `ceiling ${F.int(w.ceiling_ft)} ft` : 'no ceiling'}, wind ${w.wind_mph != null ? `${Math.round(w.wind_mph)} mph` : '–'}${w.gust_mph ? ` gusting ${Math.round(w.gust_mph)}` : ''}${w.temp_f != null ? `, ${Math.round(w.temp_f)} °F` : ''}${w.weather ? `, ${w.weather}` : ''}.` : 'Current weather is unavailable.' }),
    b && h('p', { class: 'note', text: `Normal for ${b.scope}: ${Math.round(b.mean_dep)} min mean departure delay, ${F.pct(b.late_share)} left 15+ min late, ${F.pct(b.cancel_rate, 1)} cancelled.` }),
    a.weather_baseline.length ? [h('h3', { text: '2013 departures in similar weather' }),
      kv(a.weather_baseline.map(x => [`${x.dimension}: ${x.bin}`, `${Math.round(x.mean_dep)} min, ${F.pct(x.cancel_rate, 1)} cancelled`]))] : null);
}
function historyFigure() {
  const pts = Live.history.filter(p => Date.now() - Date.parse(p.t) < 48 * 36e5);
  if (pts.length < 3) return h('section', { class: 'sect' }, h('h2', { text: 'Last 48 hours' }), h('p', { class: 'note', text: 'History builds up as the site refreshes. Check back after a few updates.' }));
  const t0 = Date.parse(pts[0].t), x = p => (Date.parse(p.t) - t0) / 6e4, span = x(pts.at(-1));
  const label = v => new Date(t0 + v * 6e4).toLocaleString('en-US', span > 1440 ? { weekday: 'short', hour: 'numeric' } : { hour: 'numeric', minute: '2-digit' });
  return h('section', { class: 'sect' }, figure({ title: 'Last 48 hours', sub: 'Counts at each refresh, on one axis',
    legend: [['Alerts for New York departures', PAL.series[0]], ['FAA programmes nationwide', PAL.series[1]]],
    chart: w => lineChart({ width: w, xTicks: [0, span / 3, 2 * span / 3, span], xFmt: label, tipTitle: label, yFmt: v => String(Math.round(v)),
      series: [{ name: 'NYC', color: PAL.series[0], pts: pts.map(p => [x(p), p.alerts]) }, { name: 'US', color: PAL.series[1], pts: pts.map(p => [x(p), p.programs]) }] }),
    table: { cols: [{ key: 't', label: 'Time', fmt: clock }, { key: 'alerts', label: 'Alerts for New York', num: true }, { key: 'programs', label: 'Programmes nationwide', num: true }], rows: [...pts].reverse().slice(0, 60) } }));
}

VIEW.now = {
  render(root) {
    if (Live.state !== 'ok') { put(root, liveUnavailable()); return; }
    const L = Live.data, feeds = L.feeds || {};
    const refresh = h('button', { class: 'btn', type: 'button', onclick: async () => { refresh.disabled = true; await Live.load(); renderAll(); } }, 'Refresh');
    put(root, viewHead('Live', 'FAA airport status and weather for departures from Newark, Kennedy and LaGuardia, beside what was normal in 2013.'),
      h('div', { class: 'row' }, refresh, h('span', { class: 'note', text: `${L.local.label}, ${Live.age()}.` })),
      L.stale_since && h('div', { class: 'banner', text: `The FAA feed could not be read on the last check, so this is the picture from ${clock(L.stale_since)}.` }),
      feeds.faa && !feeds.faa.ok && !L.stale_since && h('div', { class: 'banner', text: `The FAA feed could not be read (${feeds.faa.error}), so no programmes are shown.` }),
      feeds.metar && !feeds.metar.ok && h('div', { class: 'banner', text: `Weather could not be read (${feeds.metar.error}).` }),
      h('div', { class: 'cards' }, Object.entries(L.airports).map(([code, a]) => airportCard(code, a))),
      h('section', { class: 'sect' }, h('h2', { text: `Live alerts (${L.alerts.length})` }),
        h('p', { class: 'note', text: `${L.programs_total} FAA programmes are active nationwide. Shown here: those at the three New York airports, and those at any of the ${L.watched_destinations} destinations they served in 2013.` }),
        L.alerts.length ? h('div', { class: 'bay' }, L.alerts.map(liveStrip)) : h('p', { text: 'No FAA programme affects New York departures or their destinations right now.' })),
      historyFigure(),
      h('section', { class: 'sect' }, h('h2', { text: 'Sources' }),
        simpleTable([{ label: 'Feed', render: r => r[0] }, { label: 'Last read', wrap: true, render: r => (r[1] ? (r[1].ok ? `Read, ${F.int(r[1].items)} items, ${F.int(r[1].bytes)} bytes` : `Failed: ${r[1].error}`) : '–') }],
          [['FAA airport status (nasstatus.faa.gov)', feeds.faa], ['Aviation Weather Center METAR', feeds.metar]]),
        h('p', { class: 'note', text: 'The FAA feed lists traffic programmes by airport, not individual flights. A ground stop can exempt some origins, and the feed does not say which, so a destination alert means New York flights may be held. Baselines are 2013 figures from the archive mode.' })));
  },
};

DETAIL.live = {
  kind: 'Live alert', get: id => Live.data?.alerts.find(a => a.id === id),
  render(a) {
    const b = a.baseline || {}, all = Live.data.all_flights;
    return [h('div', { class: 'fig' }, h('h1', { text: `${a.label} at ${a.airport}` }),
      h('div', { class: 'row' }, sevMark(a.sev), link('airport', a.airport, a.airport_name))),
      h('p', { text: a.summary }),
      kv([['Reason given by the FAA', a.reason || 'none'], a.avg != null && ['Average assigned delay', fmtMin(a.avg)], spanText(a) && [a.min == null || a.min === a.max ? 'Longest delay' : 'Delay range', spanText(a)],
        a.trend && ['Trend', a.trend], a.until && ['Until', a.until], ['First seen', clock(a.first_seen)]]),
      a.scope === 'destination' ? h('section', { class: 'sect' }, h('h2', { text: 'Baseline for these routes' }),
        h('p', { text: `In ${b.month} 2013 these routes ran about ${b.flights_per_day_month} flights a day, and ${F.pct(b.on_time_month)} arrived on time. Over the year it was ${F.pct(b.on_time_year)}, against ${F.pct(b.all_flights_on_time)} for all New York departures.` }),
        simpleTable([{ label: 'Route', render: r => link('route', r.route, r.route.replace('-', ' → ')) }, { key: 'flights_month', label: `Flights, ${b.month}`, num: true, fmt: F.int },
          { key: 'on_time_month', label: `On time, ${b.month}`, num: true, fmt: v => F.pct(v) }, { key: 'on_time_year', label: 'On time, 2013', num: true, fmt: v => F.pct(v) },
          { key: 'mean_arr_month', label: `Mean arr. delay, ${b.month}`, num: true, fmt: F.smin }, { key: 'alerts_2013', label: '2013 alerts', num: true }], b.routes))
        : h('section', { class: 'sect' }, h('h2', { text: 'Baseline for this hour' }),
          b.now ? kv([[`Mean departure delay, ${b.now.scope}`, F.min(b.now.mean_dep)], ['Left 15+ min late', F.pct(b.now.late_share)], ['Cancelled', F.pct(b.now.cancel_rate, 1)],
            ['All New York departures, 2013', `${F.min(all.mean_dep)}, ${F.pct(all.cancel_rate, 1)} cancelled`]]) : h('p', { class: 'note', text: 'No 2013 flights were scheduled at this hour.' })),
      h('p', { class: 'note', text: 'Route and airport links open the 2013 archive.' })];
  },
};

// ---------- boot ----------
async function boot() {
  const liveReady = Live.load();
  try {
    const [core, airports, routes, alerts, odays] = await Promise.all(['core', 'airports', 'routes', 'alerts', 'origin_days'].map(getJSON));
    Object.assign(D, { core, airports, routes, alerts, origin_days: odays, airlines: core.airlines });
    Object.assign(D.byId, { airline: index(D.airlines), airport: index(airports), route: index(routes), alert: index(alerts), oday: index(odays) });
  } catch (err) {
    $('#main').replaceChildren(h('p', { class: 'boot', text: `The flight data could not load (${err.message}). Reload the page to try again.` }));
    return;
  }
  Triage.init(); initAsk();
  S.home = (await liveReady) ? 'now' : 'inbox';      // open on live data where it exists, else the archive
  applyHash(true);
  setInterval(() => {
    if (modeOf(S.view) !== 'live' || document.hidden) return;
    Live.load().then(() => { if (modeOf(S.view) === 'live' && !S.stack.length) renderAll(); });
  }, 5 * 60 * 1000);
  window.addEventListener('hashchange', () => {
    if (S.selfHash === location.hash.slice(1)) { S.selfHash = null; return; }
    S.selfHash = null; applyHash(false);
  });
  window.addEventListener('resize', debounce(() => { if (Math.abs(innerWidth - S.width) > 8) { S.width = innerWidth; renderAll(); } }, 200));
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && S.stack.length) closeDrawer(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
  new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
boot();

</script>
